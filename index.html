/* ============ 语音：中英混读（浏览器自带，零依赖） ============ */
function pickVoice(lang){
  try {
    var vs = window.speechSynthesis.getVoices() || [];
    var want = lang === "zh" ? /^zh/i : /^en/i;
    var pref = lang === "zh"
      ? /xiaoxiao|xiaoyi|huihui|yaoyao|ting-ting|tingting|mei-jia|sinji|female/i
      : /female|samantha|zira|aria|jenny|google us english/i;
    for (var i=0;i<vs.length;i++){ if (want.test(vs[i].lang) && pref.test(vs[i].name)) return vs[i]; }
    for (var j=0;j<vs.length;j++){ if (want.test(vs[j].lang)) return vs[j]; }
  } catch(e){}
  return null;
}
if (window.speechSynthesis){
  speechSynthesis.onvoiceschanged = function(){};
  speechSynthesis.getVoices();
}
function speakMixed(text){
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var clean = String(text).replace(/<[^>]*>/g,"");
    var parts = clean.match(/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]+|[A-Za-z][A-Za-z' \-]*[A-Za-z]|[A-Za-z]/g) || [clean];
    parts.forEach(function(p){
      var isEN = /^[A-Za-z]/.test(p);
      if (!p.trim()) return;
      var u = new SpeechSynthesisUtterance(p);
      u.lang = isEN ? "en-US" : "zh-CN";
      var v = pickVoice(isEN ? "en" : "zh"); if (v) u.voice = v;
      u.rate = isEN ? 0.82 : 1.0; u.pitch = 1.05;
      speechSynthesis.speak(u);
    });
  } catch(e){}
}

function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ============ 选词填空题型 ============ */
var fillPicks = [], fillBank = [], fillChecked = false;
function renderFill(s){
  var q = s.q;
  fillChecked = false;
  fillPicks = q.slots.map(function(){ return null; });
  fillBank = s.bank;
  var sentence = q.title.replace(/\{\{(\d+)\}\}/g, function(m, n){
    var i = Number(n) - 1;
    return '<span class="slot" id="slot'+i+'" onclick="slotTap('+i+')">'+(i+1)+'</span>';
  });
  host.innerHTML =
    '<div style="font-size:12px;color:#c3a9b3;font-weight:700">第 '+(qi+1)+' / '+TOTALQ()+' 题 · 选词填空</div>' +
    '<div class="q-title" style="font-size:17px">'+(q.slots.length>1?'把这句剧情里的词<br>一个个点回空格里':'从词库里把这一句<br>缺的那个词点回去')+'</div>' +
    '<div class="q-hint">'+q.hint+'</div>' +
    '<button class="speak" onclick="speakMixed(SESS['+qi+'].q.say)">🔊 听这句</button>' +
    '<div class="sent">'+sentence+'</div>' +
    '<div class="bank" id="bank">' + fillBank.map(function(w,k){
      return '<div class="chip" id="chip'+k+'" onclick="chipTap('+k+')">'+w+'</div>';
    }).join("") + '</div>' +
    '<div id="fillMsg" style="font-size:12.5px;color:#b09aa1;margin-top:14px;text-align:center;line-height:1.7"></div>' +
    '<button class="cta" id="fillBtn" style="margin-top:16px;opacity:.4;pointer-events:none" onclick="checkFill()">确认答案</button>';
  paintFill();
}
function chipTap(k){
  if (fillChecked) return;
  var w = fillBank[k];
  if (fillPicks.indexOf(w) >= 0) { fillPicks[fillPicks.indexOf(w)] = null; }
  else {
    var empty = fillPicks.indexOf(null);
    if (empty < 0) return;
    fillPicks[empty] = w;
  }
  paintFill();
}
function slotTap(i){
  if (fillChecked) return;
  if (fillPicks[i]) { fillPicks[i] = null; paintFill(); }
}
function paintFill(){
  var q = SESS[qi].q;
  q.slots.forEach(function(_, i){
    var el = document.getElementById("slot"+i);
    if (!el) return;
    var v = fillPicks[i];
    el.textContent = v ? v : String(i+1);
    el.className = "slot" + (v ? " filled" : "");
  });
  fillBank.forEach(function(w, k){
    var chip = document.getElementById("chip"+k);
    if (chip) chip.className = "chip" + (fillPicks.indexOf(w) >= 0 ? " used" : "");
  });
  var left = fillPicks.filter(function(x){ return !x; }).length;
  var msg = document.getElementById("fillMsg");
  if (msg) msg.textContent = left ? ("还差 " + left + " 个空 · 点已填的词可以取回") : "填好了，点「确认答案」提交";
  var btn = document.getElementById("fillBtn");
  if (btn){
    btn.style.opacity = left ? ".4" : "1";
    btn.style.pointerEvents = left ? "none" : "auto";
  }
}
function checkFill(){
  if (fillChecked) return;
  fillChecked = true;
  var q = SESS[qi].q;
  var picks = fillPicks.slice();
  q.slots.forEach(function(w, i){
    var el = document.getElementById("slot"+i);
    if (el) el.className = "slot " + (picks[i] === w ? "ok" : "bad");
  });
  answers[qi] = { picks: picks };
  var bad = q.slots.filter(function(w,i){ return picks[i] !== w; });
  var msg = document.getElementById("fillMsg");
  if (msg) msg.innerHTML = bad.length
    ? '正确答案：<b style="color:#2f7f45">'+bad.join(" / ")+'</b>'
    : '全对 ✓ 这一句你已经吃透了';
  var btn = document.getElementById("fillBtn");
  if (btn) btn.style.display = "none";
  var t = setTimeout(advance, 1350);
  timers.push(t);
}

/* ============ 统计 ============ */
function quickStats(from, to){
  var hit = 0, total = 0;
  for (var i=from;i<to;i++){
    var q = QUESTIONS[i], a = answers[i];
    if (q.type === "fill"){
      var picks = (a && a.picks) || [];
      q.slots.forEach(function(w,si){ total++; if (picks[si] === w) hit++; });
    } else {
      total++;
      if (a === SESS[i].correct) hit++;
    }
  }
  return { hit: hit, total: total };
}

/* ============ 结果 ============ */
function computeResult(){
  var byDim = {A:{ok:0,total:0},B:{ok:0,total:0}};
  var wrong = [], wordsHit = 0, totalWords = 0, qCorrect = 0;
  QUESTIONS.forEach(function(q,i){
    var a = answers[i];
    if (q.type === "fill"){
      byDim.B.total++;
      var picks = (a && a.picks) || [];
      var okAll = true;
      q.slots.forEach(function(w, si){
        totalWords++;
        if (picks[si] === w) wordsHit++; else { okAll = false; wrong.push(w); }
      });
      if (okAll) { byDim.B.ok++; qCorrect++; }
    } else {
      byDim.A.total++; totalWords++;
      if (a === SESS[i].correct){ byDim.A.ok++; wordsHit++; qCorrect++; }
      else wrong.push(q.word);
    }
  });
  var score = Math.round(40 + 60 * wordsHit / totalWords);
  var order = ["A","B"].sort(function(x,y){
    return byDim[x].ok/byDim[x].total - byDim[y].ok/byDim[y].total;
  });
  return { score:score, wordsHit:wordsHit, totalWords:totalWords, qCorrect:qCorrect,
           byDim:byDim, wrong:wrong, worst:order[0] };
}
function renderResult(){
  clearTimers(); progressWrap.style.display = "none";
  window.__res = computeResult();
  var r = window.__res;
  var pct = Math.round(r.wordsHit / r.totalWords * 100);
  var bars = ["A","B"].map(function(k){
    var d = r.byDim[k];
    var p = d.total ? Math.round(d.ok/d.total*100) : 0;
    return '<div class="bar-row"><div class="bar-top"><span>'+DIMS[k].name+'</span><span>'+d.ok+' / '+d.total+' 题</span></div>' +
           '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div></div>';
  }).join("");
  var uniq = [];
  r.wrong.forEach(function(w){ if (uniq.indexOf(w) < 0) uniq.push(w); });
  var wrongCards = uniq.slice(0,5).map(function(w){
    var d = WORDS[w];
    if (!d) return "";
    return '<div class="wrow"><span class="w">'+w+'</span><span class="m">'+d.zh+'<br><span style="color:#b09aa1">'+d.hook+'</span></span></div>';
  }).join("");
  var worstTxt = r.worst === "B"
    ? "「一句里好几个词」是你最该补的一环——去句子里看这几个词怎么各就各位"
    : "剧情挖空是你最该补的一环——把词放回故事再过一遍，比死背快得多";
  var wlist = ALL_WORDS.map(function(w){
    return '<div class="wl-row"><b>'+w+'</b><span>'+WORDS[w].zh+'</span></div>';
  }).join("");
  /* 总分：剧情 QPLOT() 题 + 重点词回顾 5 + 真题迁移 5 —— 按整套题数算，别写死 */
  var mq = mqScore || 0, mig = migScore || 0;
  var rightAll = r.qCorrect + mq + mig;
  var totalScore = Math.round(40 + 60 * rightAll / TOTALQ());

  host.innerHTML =
    '<div style="text-align:center"><div class="toast">🎀 '+TOTALQ()+' 题全部做完 · 你接住了 '+r.wordsHit+' / '+r.totalWords+' 个词</div></div>' +
    '<div class="result-card">' +
      '<div style="font-size:46px;font-weight:800;color:#c2708c;line-height:1">'+totalScore+'</div>' +
      '<div style="font-size:12.5px;color:#b09aa1;margin-top:6px">'+(userName||"匿名测试者")+' · '+EPS[curEP].nav+' '+TOTALQ()+' 题总掌握度</div>' +
      '<div class="big-line" style="margin-top:16px">本集里藏着的词<br>你接住了 <span class="hl">'+pct+'%</span></div>' +
      '<div class="bars">'+bars+'</div>' +
      '<div class="seg-score">' +
        '<div class="ss-row"><span>剧情测试 · '+QPLOT()+' 题</span><b>'+r.qCorrect+' / '+QPLOT()+'</b></div>' +
        '<div class="ss-row"><span>重点词回顾 · '+QMEM()+' 题</span><b>'+mq+' / '+QMEM()+'</b></div>' +
        '<div class="ss-row"><span>真题迁移 · '+QMIG()+' 题</span><b>'+mig+' / '+QMIG()+'</b></div>' +
      '</div>' +
      '<div class="sub-line">整套 <b style="color:#4a2f36">'+TOTALQ()+' 题</b> 全部做完 · '+ALL_WORDS.length+' 个词一个不漏</div>' +
    '</div>' +

    '<div class="result-card" style="text-align:left;margin-top:14px">' +
      '<div class="wordcard" style="margin-top:0">' +
        '<div class="wt">你最该补的一环</div>' +
        '<div style="font-size:13px;color:#7d6b71;line-height:1.8">'+worstTxt+'</div>' +
      '</div>' +

      (wrongCards ? '<div class="wordcard"><div class="wt">错词卡 · 带记忆钩子</div>'+wrongCards+'</div>' : '') +

}

    '<div class="cert">' +
      '<div class="seal">🎀</div>' +
      '<div style="font-size:12px;letter-spacing:2px;color:#b09aa1;font-weight:700">剧情词汇报告</div>' +
      '<div style="font-size:26px;font-weight:800;color:#3a2a2e;margin-top:10px">'+(userName||"匿名测试者")+'</div>' +
      '<div style="font-size:13px;color:#9c848d;margin-top:12px;line-height:1.8">在 '+EPS[curEP].adTag+' 里<br>接住了 <b style="color:#c2708c">'+r.wordsHit+'</b> / '+ALL_WORDS.length+' 个考研高频词</div>' +
      '<div style="font-size:38px;font-weight:800;color:#c2708c;margin:16px 0 4px">'+Math.round(40 + 60 * (r.qCorrect+mq+mig) / TOTALQ())+'</div>' +
      '<div style="font-size:12px;color:#b09aa1">完整 '+TOTALQ()+' 题 · 总掌握度 · 满分 100</div>' +
      '<div style="font-size:12px;color:#b09aa1;margin-top:6px">剧情 '+r.qCorrect+'/'+QPLOT()+'　·　重点词回顾 '+mq+'/'+QMEM()+'　·　真题迁移 '+mig+'/'+QMIG()+'</div>' +
      '<div style="margin-top:18px;font-size:12px;color:#b3a0a6">'+dateStr+' · 考研高频词 500 · '+EPS[curEP].label+'</div>' +
    '</div>' +
    certBtns +
    '<a class="xlink" href="https://iq-test.app.workbuddy.host/">顺便测测你的认知类型 →</a>' +
    '<div class="legal">长按或截图保存 ✨<br>数据仅保存在本机</div>';
}

/* ============ 重点词卡（每章 5 个 · 点卡片翻面） ============ */
function starsHTML(n){
  var s = "";
  for (var i=1;i<=5;i++) s += (i<=n ? "★" : "☆");
  return s;
}
function renderWordCards(ctx){
  clearTimers(); progressWrap.style.display = "none";
  wcCtx = (ctx === "mid") ? "mid" : "post";
  wcIdx = 0;
  paintWordCard();
}
function paintWordCard(){
  var c = WORD_CARDS[wcIdx];
  var front =
    '<div style="text-align:center;padding-top:26px">' +
      '<div><span class="wc-num">0'+(wcIdx+1)+'</span><span class="wc-word">'+c.word+'</span></div>' +
      '<div class="wc-phon">'+c.phon+'</div>' +
      '<div class="wc-pos"><b>'+c.pos+'</b> '+c.zh+'</div>' +
      '<div class="wc-stars">'+starsHTML(c.stars)+'</div>' +
      '<button class="speak" style="margin-top:22px" onclick="event.stopPropagation();speakMixed(\''+c.word+'\')">🔊 听发音</button>' +
    '</div>';
  var back =
    '<div class="wc-row"><div class="rt">📌 真题先记</div><div class="rc">'+c.first+'</div></div>' +
    '<div class="wc-row"><div class="rt">⚠️ 易错误区</div><div class="rc">'+c.trap+'</div></div>' +
    '<div class="wc-row"><div class="rt">🔥 高频搭配</div><div class="rc">'+c.collos+'</div></div>' +
    '<div class="wc-row"><div class="rt">🔁 同义替换</div><div class="rc">'+c.syn+'</div></div>' +
    '<div class="wc-row" style="border-left-color:#d8c4ee"><div class="rt">✍️ 真题语境 · 考法</div><div class="rc">'+c.ctx+'</div></div>';
  host.innerHTML =
    '<div class="wc-head"><span class="wc-badge">'+EPS[curEP].label.toUpperCase()+'</span><span class="wc-range">重点词卡 · WORDS 0'+(wcIdx+1)+'–05</span></div>' +
    '<div class="wc-flow">'+(wcCtx === "mid"
      ? '先记这 '+WORD_CARDS.length+' 个词 · 翻完自动接 '+RANGE(QPLOT()+1, QPLOT()+QMEM())
      : '本集 5 个重点词 · 正面认词 · 背面五个考点')+'</div>' +
    '<div class="wc-stage" onclick="wcFlip()">' +
      '<div class="wc-card'+(window.__wcFlip?" flip":"")+'" id="wcCard">' +
        '<div class="wc-face">'+front+'</div>' +
        '<div class="wc-face wc-back">'+back+'</div>' +
      '</div>' +
    '</div>' +
    '<div class="wc-flip-tip">点卡片翻面 · 背面是五个考点</div>' +
    '<div class="wc-nav">' +
      '<button class="wc-btn" onclick="wcNav(-1)"'+(wcIdx===0?" disabled":"")+'>← 上一个</button>' +
      '<button class="wc-btn primary" onclick="wcNav(1)">'+(wcIdx===WORD_CARDS.length-1?"完成 ✓":"下一个 →")+'</button>' +
    '</div>';
  window.__wcFlip = false;
}
function wcFlip(){
  window.__wcFlip = !window.__wcFlip;
  var el = document.getElementById("wcCard");
  if (el) el.className = "wc-card" + (window.__wcFlip ? " flip" : "");
}
function wcNav(d){
  wcIdx += d;
  if (wcIdx < 0) wcIdx = 0;
  if (wcIdx >= WORD_CARDS.length){
    /* 中途进的（剧情段之后）→ 接着做回顾；赛后来的 → 回成绩单 */
    if (wcCtx === "mid") renderMemoryQuiz();
    else renderCert();
    return;
  }
  window.__wcFlip = false;
  paintWordCard();
}

/* ============ 重点词回顾（5 题 · 一词一钩子，钩子也要考出来） ============ */
var MQS = [], mqIdx = 0, mqScore = 0, mqPicked = null, mq2Picked = null;
function shuf0(arr){ /* 正确项固定在第 0 位，运行时洗牌并重映射答案 */
  var idx = arr.map(function(_, i){ return i; });
  for (var i = arr.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  return { arr: idx.map(function(k){ return arr[k]; }), ans: idx.indexOf(0) };
}
function renderMemoryQuiz(){
  clearTimers(); progressWrap.style.display = "none";
  MQS = MEMQ.map(function(q){
    var m = shuf0(q.opts), m2 = shuf0(q.q2.opts);
    return { opts: m.arr, ans: m.ans, q2opts: m2.arr, q2ans: m2.ans };
  });
  mqIdx = 0; mqScore = 0; mqPicked = null; mq2Picked = null;
  paintMQ();
}
function paintMQ(){
  progressWrap.style.display = "flex";
  setProgress(QUESTIONS.length + mqIdx);
  var q = MEMQ[mqIdx], s = MQS[mqIdx], done = mqPicked !== null;
  var optHtml = s.opts.map(function(o,i){
    var cls = "opt";
    if (done && i === s.ans) cls += " ok";
    if (done && i === mqPicked && i !== s.ans) cls += " bad";
    return '<div class="'+cls+'"'+(done?"":" onclick=\"mqPick("+i+")\"")+'>'+o+'</div>';
  }).join("");
  var tail = "";
  if (done){
    /* 第二小步：把钩子本身也考出来（趁热一刀 · 不计分，不占题号） */
    var miniDone = mq2Picked !== null;
    var miniHtml = s.q2opts.map(function(o,i){
      var cls = "opt";
      if (miniDone && i === s.q2ans) cls += " ok";
      if (miniDone && i === mq2Picked && i !== s.q2ans) cls += " bad";
      return '<div class="'+cls+'"'+(miniDone?"":" onclick=\"mqPick2("+i+")\"")+'>'+o+'</div>';
    }).join("");
    tail =
      '<div class="mq-hook">'+q.hook+'</div>' +
      '<div style="margin-top:16px"><span class="mq-tag">趁热一刀 · 不计分</span>' +
        '<div class="q-title" style="font-size:15px;margin-top:8px">'+q.q2.stem+'</div>' +
        '<div class="opt-list" style="margin-top:10px">'+miniHtml+'</div>' +
        (miniDone ? '<div style="font-size:12.5px;color:#8a6f7c;line-height:1.7;margin-top:10px">💡 '+q.q2.why+'</div>' : '') +
      '</div>' +
      (miniDone ? '<button class="cta" style="margin-top:18px" onclick="mqNext()">'+(mqIdx===MEMQ.length-1?"看回顾小结 →":"下一题 →")+'</button>' : '');
  }
  host.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px"><span class="mq-tag">'+q.meth+'</span>' +
      '<span style="font-size:12px;color:#c3a9b3;font-weight:700">第 '+(QUESTIONS.length+mqIdx+1)+' / '+TOTALQ()+' 题 · 重点词回顾</span></div>' +
    '<div class="q-title" style="font-size:17px">'+q.title+'</div>' +
    '<button class="speak" onclick="speakMixed(\''+q.word+'\')">🔊 听这个词</button>' +
    '<div class="opt-list" style="margin-top:14px">'+optHtml+'</div>' +
    tail;
}
function mqPick(i){
  if (mqPicked !== null) return;
  mqPicked = i;
  if (i === MQS[mqIdx].ans) mqScore++;
  paintMQ();
}
function mqPick2(i){
  if (mq2Picked !== null || mqPicked === null) return;
  mq2Picked = i;
  paintMQ();
}
function mqNext(){
  if (mq2Picked === null) return; /* 钩子那一刀没考完不许走 */
  mqIdx++;
  if (mqIdx >= MEMQ.length){ window.__mqDone = true; renderSegment("recall"); return; }
  mqPicked = null; mq2Picked = null;
  paintMQ();
}
function renderMemoryResult(){
  clearTimers(); progressWrap.style.display = "none";
  window.__mqDone = true;
  var line = mqScore === 5 ? "五个钩子全都挂住了，这组词拿下了 🎀"
           : mqScore >= 3 ? "大部分钩子挂住了，剩下的多看一眼就牢"
           : "钩子刚起头，回词卡再翻一遍会更顺";
  var list = MEMQ.map(function(q){
    return '<div class="mq-mini"><div class="w">'+q.word+' <span style="color:#8a5fb5;font-size:11px;font-weight:800">· '+q.meth+'</span></div><div class="m">'+q.memo+'</div></div>';
  }).join("");
  host.innerHTML =
    '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center">' +
      '<div style="font-size:44px">🪝</div>' +
      '<div style="font-size:22px;font-weight:800;color:#3a2a2e;margin-top:8px">记忆钩子收好了</div>' +
      '<div style="font-size:36px;font-weight:800;color:#c2708c;margin:14px 0 2px">'+mqScore+' / 5</div>' +
      '<div style="font-size:13px;color:#9c848d">'+line+'</div>' +
      '<div style="margin-top:20px;text-align:left">'+list+'</div>' +
    '</div>' +
    '<div class="toast" style="margin-top:18px">🎀 已经做完 '+(QPLOT()+QMEM())+' 题 · 还剩最后 '+QMIG()+' 题（'+RANGE(QPLOT()+QMEM()+1, TOTALQ())+'）</div>' +
    '<button class="cta" style="margin-top:16px" onclick="renderMigQuiz()">继续 · 去做 '+RANGE(QPLOT()+QMEM()+1, TOTALQ())+'（真题迁移）→</button>' +
    '<button class="cta" style="margin-top:10px;background:#fff;color:#8f6472;border:1.5px solid #eddfe3" onclick="renderMemoryQuiz()">再练一遍</button>' +
    '<button class="cta" style="margin-top:10px;background:#fff;color:#8f6472;border:1.5px solid #eddfe3" onclick="renderCert()">回我的证书</button>' +
    '<div class="legal">5 个钩子来自本集 5 个重点词 · 记法仅供辅助记忆</div>';
}

/* ============ 真题迁移（5 题 · 剧情词换到真题句里） ============ */
var MIGS = [], migIdx = 0, migScore = 0, migPicked = null;
function renderMigQuiz(){
  clearTimers(); progressWrap.style.display = "none";
  MIGS = MIGQ.map(function(q){
    var idx = [0,1,2,3];
    for (var i=3;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    return { opts: idx.map(function(k){ return q.opts[k]; }), ans: idx.indexOf(q.ans) };
  });
  migIdx = 0; migScore = 0; migPicked = null;
  paintMIG();
}
function paintMIG(){
  progressWrap.style.display = "flex";
  setProgress(QUESTIONS.length + MEMQ.length + migIdx);
  var q = MIGQ[migIdx], s = MIGS[migIdx], done = migPicked !== null;
  var optHtml = s.opts.map(function(o,i){
    var cls = "opt";
    if (done && i === s.ans) cls += " ok";
    if (done && i === migPicked && i !== s.ans) cls += " bad";
    return '<div class="'+cls+'"'+(done?"":" onclick=\"migPick("+i+")\"")+'>'+o+'</div>';
  }).join("");
  host.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px"><span class="mj-tag">真题迁移</span>' +
      '<span style="font-size:12px;color:#c3a9b3;font-weight:700">第 '+(QUESTIONS.length+MEMQ.length+migIdx+1)+' / '+TOTALQ()+' 题 · 真题迁移</span></div>' +
    '<div class="mj-stem">'+q.stem+'</div>' +
    '<div class="q-hint">考一个真题高频搭配 · 凭句感和词形选</div>' +
    '<div class="opt-list" style="margin-top:14px">'+optHtml+'</div>' +
    (done ?
      '<div class="mq-hook"><div style="font-size:12px;color:#2f6fa8;font-weight:700;margin-bottom:6px">考点：'+q.tag+'</div>💡 '+q.why+'<div class="mj-ep">'+q.ep+'</div></div>' +
      '<button class="cta" style="margin-top:18px" onclick="migNext()">'+(migIdx===MIGQ.length-1?"看迁移结果":"下一题 →")+'</button>'
      : '');
}
function migPick(i){
  if (migPicked !== null) return;
  migPicked = i;
  if (i === MIGS[migIdx].ans) migScore++;
  paintMIG();
}
function migNext(){
  migIdx++;
  if (migIdx >= MIGQ.length){ window.__migDone = true; renderLoading(); return; }
  migPicked = null;
  paintMIG();
}
function renderMigResult(){
  clearTimers(); progressWrap.style.display = "none";
  window.__migDone = true;
  var line = migScore === 5 ? "剧情里学过的词，换到真题句里你全都认出来了 🎀"
           : migScore >= 3 ? "大部分能迁移过去，剩下几个是真题里的固定搭配，再看一眼"
           : "真题句比剧情句绕，这几个词回词卡再翻一遍会更稳";
  var list = MIGQ.map(function(q){
    return '<div class="mq-mini"><div class="w">'+q.word+' <span style="color:#2f6fa8;font-size:11px;font-weight:800">· '+q.tag+'</span></div><div class="m">'+q.why+'</div></div>';
  }).join("");
  host.innerHTML =
    '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center">' +
      '<div style="font-size:44px">🎯</div>' +
      '<div style="font-size:22px;font-weight:800;color:#3a2a2e;margin-top:8px">真题迁移完成</div>' +
      '<div style="font-size:36px;font-weight:800;color:#c2708c;margin:14px 0 2px">'+migScore+' / 5</div>' +
      '<div style="font-size:13px;color:#9c848d">'+line+'</div>' +
      '<div style="margin-top:20px;text-align:left">'+list+'</div>' +
    '</div>' +
    '<div class="toast" style="margin-top:18px">🎀 '+TOTALQ()+' 题全部完成 · 剧情 '+QPLOT()+' + 重点词 '+QMEM()+' + 迁移 '+QMIG()+'</div>' +
    '<button class="cta" style="margin-top:16px" onclick="renderCert()">回我的词汇报告</button>' +
    '<button class="cta" style="margin-top:10px;background:#fff;color:#8f6472;border:1.5px solid #eddfe3" onclick="renderMigQuiz()">迁移题再练一遍</button>' +
    '<button class="cta" style="margin-top:10px;background:#fff;color:#8f6472;border:1.5px solid #eddfe3" onclick="renderAd()">回开场</button>' +
    '<div class="legal">真题句按考研常见考法改写 · 词全部来自本集 · 合集版 v24</div>';
}

loadEP(0);
</script>
